syntax = "proto3";

package realityapi;

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message Hello {
  string name = 1;
}

message Text {
  string text = 1;
}

enum DeviceType {
  VR = 0;
  AR = 1;
  DOG = 2;
  ARM = 3;
  TURTLE = 4;
}

// Keepalive sent by a device so the server can tell when it goes away.
// The device is identified by the Packet's own id and devicetype fields.
message Heartbeat {
  double current_time = 1;
}

message Packet {
  Vector3 position = 3;
  DeviceType devicetype = 4;
  string id = 5;
  Heartbeat heartbeat = 6;
}
