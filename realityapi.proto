syntax = "proto3";

package realityapi;

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message Hello {
  string name = 1;
}

message Text {
  string text = 1;
}

enum DeviceType {
  VR = 1;
  AR = 2;
  DOG = 3;
  ARM = 4;
  TURTLE = 5;
}

message Packet {
  Vector3 position = 3;
  DeviceType devicetype = 4;
  string id = 5;
}