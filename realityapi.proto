syntax = "proto3";

package realityapi;

import "google/protobuf/empty.proto";

message Vector2 {
    float x = 1;
    float y = 2;
}

message Transform2 {
    Vector2 position = 1;
    // in radians
    float rotation = 2;
}

message Polygon2 {
    repeated Vector2 vertices = 1;
}

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message Transform3 {
  Vector3 position = 1;
  Vector3 rotation = 2;
}

message Lidar2 {
    repeated Vector2 points = 1;
}

message Lidar3 {
  repeated Vector3 points = 1;
}

message RawLidar2Scan {
  repeated float ranges = 1; // raw LaserScan distances
  float range_min = 2;
  float range_max = 3;
  float angle_min = 4;
  float angle_increment = 5;
}

// A raw 3D point cloud (the dog). The server crops, downsamples and converts it.
message RawPointCloud {
  string id = 1;
  // Pose of the robot when the cloud was read, in the SERVER's own axes
  // (ROS x/y/z for the dog). The server uses its position as the crop centre.
  Transform3 transform = 2;

  // Packed little-endian float32 x, y, z triples: 12 bytes per point, in the
  // same frame and axes as `transform`.
  bytes xyz = 3;
}

// room bounds (2d)
message RoomBounds {
    Vector2 origin = 1;
    Polygon2 room = 2;
    repeated Polygon2 obstacles = 3;
}

// occupancy grid cell (2d), indexed in the server frame
message OccupancyCell {
    int32 x = 1;
    int32 z = 2;
    float p = 3; // probability the cell is occupied
}

// occupancy grid (2d)
message OccupancyGrid {
    float cell_size = 1;
    uint64 revision = 3;
    // wipe every cell back to unknown (0.5) before applying cells
    bool reset = 4;
    repeated OccupancyCell cells = 5;
}

enum DeviceType {
  NONE = 0;
  VR = 1;
  AR = 2;
  DOG = 3;
  ARM = 4;
  TURTLE = 5;
}

// A device report. Everything after timestamp is optional so a client can send
// a pose-only or lidar-only update without clobbering the other.
message DeviceInfo {
  string id = 1;
  DeviceType device_type = 2;
  float timestamp = 3;

  optional Transform3 transform3 = 4;
  optional Lidar3 lidar3 = 5;
  optional Transform2 transform2 = 6;
  optional Lidar2 lidar2 = 7;
  optional RawLidar2Scan raw_lidar2_scan = 8;
  optional RawPointCloud raw_point_cloud = 9;
}

message AllDeviceInfo {
  repeated DeviceInfo devices = 1;
}

message Response {
  // corresponds to the request that this is a response to
  string req_uuid = 1;

  oneof data {
    // basic response used to denote simple ok
    google.protobuf.Empty ok = 4;
    // device with id not found
    google.protobuf.Empty err_id_not_found = 5;
    // device/server does not support operation
    google.protobuf.Empty err_not_supported = 6;
    // device/server cannot execute operation at this time
    google.protobuf.Empty err_cannot_execute = 7;
    // device/server failed while executing operation
    google.protobuf.Empty err_failed_execute = 8;

    // actual responses
    AllDeviceInfo all_device_info = 20;
    DeviceInfo device_info = 21;
    Lidar2 lidar_data = 22;
    RoomBounds room_bounds = 23;
    OccupancyGrid occupancy_grid = 24;
  }
}

message Command {
  // this is the target of the command
  string target_id = 1;

  // multiple demands can be packaged into one command
  optional Transform3 transform3 = 2;
  optional Transform2 transform2 = 3;
}

message OccupancyGridReq {
    DeviceType device_type = 1;
    uint64 since_revision = 2;
}

message ServerRequest {
  // set this and remember it!
  string req_uuid = 1;

  oneof data {
    DeviceInfo post_device_info = 4;
    string post_heartbeat = 5;
    google.protobuf.Empty fetch_all_device_info = 6;
    string fetch_single_device_info = 7;
    Command send_command = 8;
    google.protobuf.Empty fetch_lidar_data = 9;
    google.protobuf.Empty clear_accumulated_scan = 11;
    google.protobuf.Empty fetch_room_bounds = 13;
    OccupancyGridReq fetch_occupancy_grid = 14; // revision already applied; 0 for everything
  }
}

message ClientRequest {
  // set this and remember it!
  string req_uuid = 1;

  oneof data {
    google.protobuf.Empty fetch_device_info = 4;
    Command post_command = 5;
  }
}
