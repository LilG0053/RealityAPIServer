syntax = "proto3";

import "google/protobuf/empty.proto";

package realityapi;

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message Transform {
    Vector3 position = 1;
    Vector3 rotation = 2;
}

message Lidar {
    repeated Vector3 points = 1;
}

enum DeviceType {
    NONE = 0;
    VR = 1;
    AR = 2;
    DOG = 3;
    ARM = 4;
    TURTLE = 5;
}

message DeviceInfo {
    string id = 1;
    DeviceType device_type = 2;
    float timestamp = 3;

    optional Transform transform = 4;
    optional Lidar lidar = 5;
}

message AllDeviceInfo {
    repeated DeviceInfo devices = 1;
}

message Response {
    string request_id = 1;

    oneof data {
        // basic responses used to denote simple ok/error
        google.protobuf.Empty ok = 2;
        // device with id=id not found
        google.protobuf.Empty err_id_not_found = 3;
        // device does not support operation
        google.protobuf.Empty err_not_supported = 4;

        /* Space for more error types in future...? */

        // actual responses
        AllDeviceInfo all_device_info = 10;
        DeviceInfo device_info = 11;
    }
}

message Command {
    string id = 1;

    oneof command {
        Transform transform = 2;
    }
}

// Websocket envelope for the Server service: each binary frame from a client
// is one ServerRequest, answered with one Response. Field names mirror the rpcs.
message ServerRequest {
    string req_uuid = 1;

    oneof data {
        DeviceInfo post_device_info = 4;
        string post_heartbeat = 5;
        google.protobuf.Empty fetch_all_device_info = 6;
        string fetch_single_device_info = 7;
        Command send_command = 8;
    }
}

message ClientRequest {
    string req_uuid = 1;

    oneof data {
        google.protobuf.Empty fetch_device_info = 4;
        Command post_command = 5;
    }
}
