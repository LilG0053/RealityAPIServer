<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robot Room</title>
  <link rel="stylesheet" href="style.css?v=26" />

  <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/",
          "@bufbuild/protobuf": "https://esm.sh/@bufbuild/protobuf@2.16.0",
          "@bufbuild/protobuf/": "https://esm.sh/@bufbuild/protobuf@2.16.0/"
        }
      }
    </script>
</head>

<body>
  <main class="app-layout">
    <section class="visualization-panel" aria-label="Room map">
      <p class="instructions">Drag to rotate · Right-drag to pan · Scroll to zoom</p>
      <p class="axis-key"><span class="x-axis">X</span> width · <span class="y-axis">Y</span> height · <span
          class="z-axis">Z</span> depth</p>
      <div class="map-legend" aria-label="Map layer colors">
        <span><i class="legend-swatch robot-location"></i>Robot location</span>
        <span><i class="legend-swatch live-scan"></i>Live scan</span>
        <span><i class="legend-swatch accumulated-map"></i>Accumulated map</span>
        <span><i class="legend-swatch free-cell"></i>Unoccupied, stronger toward 0</span>
        <span><i class="legend-swatch occupied-cell"></i>Occupied, stronger toward 1</span>
        <span><i class="legend-swatch unknown-cell"></i>Unknown (0.5)</span>
        <span id="occupancy-status" role="status">Waiting for occupancy grid</span>
      </div>
      <div id="scene-container"></div>
    </section>

    <aside class="dashboard" aria-labelledby="dashboard-title">
      <h1 id="dashboard-title">DASHBOARD</h1>
      <button id="clear-scan" type="button">Clear accumulated scan</button>
      <button id="save-rmse-histogram" type="button">Save RMSE histogram</button>
      <p id="rmse-status" role="status" aria-live="polite"></p>
      <div id="tunables" aria-label="Tunable parameters"></div>
      <div id="log-container"></div>
    </aside>
  </main>

  <script type="module" src="main.js?v=26"></script>
</body>

</html>
